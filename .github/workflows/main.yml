name: basic check
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: build with gradle
        run: ./gradlew build
      - name: run checkstyle
        run: ./gradlew checkstyleMain
      
      
