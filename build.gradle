plugins {
    id 'java'
    id 'pmd'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'com.stavre'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Source: https://mvnrepository.com/artifact/org.assertj/assertj-core
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

test {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = "13.2.0"
    ignoreFailures = false
    setSourceSets(["src/main/java/com/stavre/calculator"] as Collection<SourceSet>)
    configDirectory = file("${project.rootDir}/checkstyle")
    configFile = file("${project.rootDir}/checkstyle/checkstyle.xml")
}

pmd {
    ignoreFailures = false
    consoleOutput = true
    toolVersion = "7.16.0"
    rulesMinimumPriority = 5
    ruleSets = ["category/java/errorprone.xml", "category/java/bestpractices.xml"]
}

shadowJar {
    manifest.attributes["Main-Class"] = "com.stavre.calculator.Main"
}